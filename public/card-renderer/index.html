<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inflow Matrix Card Browser</title>
    <link rel="stylesheet" href="../shared/card-gradients.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a2e;
            color: white;
        }
        
        /* Header */
        .header {
            background: rgba(0,0,0,0.5);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .header-actions {
            display: flex;
            gap: 1rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn:disabled:hover {
            background: #667eea;
            transform: none;
        }

        /* Inside the white modal-content, the header's dark btn-secondary
           (near-white on transparent) would be invisible on a white background */
        .modal-content .btn-secondary {
            background: #eee;
            color: #333;
        }

        .modal-content .btn-secondary:hover {
            background: #ddd;
        }
        
        /* Filters */
        .filters {
            padding: 1.5rem 2rem;
            background: rgba(0,0,0,0.3);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .filter-group label {
            font-size: 14px;
            font-weight: 600;
        }
        
        .filter-group select,
        .filter-group input {
            padding: 0.5rem;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 5px;
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 14px;
        }
        
        .card-count {
            margin-left: auto;
            font-size: 14px;
            opacity: 0.7;
        }
        
        /* Cards Grid */
        .cards-container {
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .card {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            justify-self: center;
        }
        
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 60px rgba(102,126,234,0.5);
        }
        
        .card-background {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* Gradients: loaded from ../shared/card-gradients.css (see <link> in <head>) */

        .light-beam {
            position: absolute;
            width: 120px;
            height: 250px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.4;
        }
        
        .beam-top {
            top: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            clip-path: polygon(40% 0%, 60% 0%, 80% 100%, 20% 100%);
        }
        
        .beam-bottom {
            bottom: 0;
            background: linear-gradient(0deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            clip-path: polygon(20% 0%, 80% 0%, 60% 100%, 40% 100%);
        }
        
        .pole {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            border: 3px solid;
            border-radius: 20px;
            padding: 8px 30px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            z-index: 10;
        }
        
        .pole-top {
            top: 15px;
            border-color: #90EE90;
            color: #555;
        }
        
        .pole-bottom {
            bottom: 15px;
            border-color: #87CEEB;
            color: #555;
        }
        
        .card-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 85%;
            z-index: 5;
        }
        
        .card-type {
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: capitalize;
            background: rgba(255,255,255,0.7);
            padding: 3px 12px;
            border-radius: 12px;
            display: inline-block;
        }
        
        .card-title {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: clamp(28px, 8vw, 38px);
            font-weight: 900;
            color: #000;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
            line-height: 0.95;
        }
        
        .card-description-box {
            background: rgba(255,255,255,0.6);
            border-radius: 20px;
            padding: 15px 20px;
            margin: 10px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }
        
        .card-description {
            font-size: 13px;
            line-height: 1.4;
            color: #333;
            font-weight: 500;
        }
        
        .card-id {
            font-size: 14px;
            color: rgba(0,0,0,0.8);
            font-weight: 700;
            font-family: 'Arial', sans-serif;
            background: rgba(255,255,255,0.8);
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 8px;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eee;
        }
        
        .modal-header h2 {
            color: #333;
            font-size: 1.5rem;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 2rem;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .close-btn:hover {
            color: #333;
        }
        
        .form-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: 1fr 1fr;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group.full {
            grid-column: 1 / -1;
        }
        
        .form-group label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            color: #333;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .modal-actions .btn {
            flex: 1;
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(255,255,255,0.5);
        }
        
        .empty-state h2 {
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        /* View Card modal */
        .view-card-content {
            max-width: 700px;
        }

        .view-card-body {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: center;
        }

        .view-card-preview {
            flex-shrink: 0;
        }

        .view-card-preview .card {
            width: 260px;
            height: 260px;
            cursor: default;
        }

        .view-card-preview .card:hover {
            transform: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .view-card-meta {
            flex: 1;
            min-width: 220px;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.6rem 1rem;
            align-content: start;
        }

        .view-card-meta dt {
            font-weight: 700;
            color: #777;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }

        .view-card-meta dd {
            color: #222;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>Inflow Matrix Card Browser</h1>
        <div class="header-actions">
            <a class="btn btn-secondary" href="/" style="text-decoration:none;display:inline-flex;align-items:center;">&larr; Home</a>
            <button class="btn" onclick="openModal()">+ Add New Card</button>
            <button class="btn btn-secondary" onclick="exportJSON()">Export JSON</button>
        </div>
    </div>
    
    <!-- Filters -->
    <div class="filters">
        <div class="filter-group">
            <label>Set:</label>
            <select id="filterSet" onchange="onSetFilterChange()">
                <option value="">All Sets</option>
                <option value="Conversation">Conversation (80)</option>
                <option value="Values">Value Lens (115)</option>
                <option value="Choice">Choice Lens (39)</option>
                <option value="Flow">Flow Lens</option>
                <option value="Harmony">Harmony Lens (30)</option>
                <option value="Synergy">Synergy Lens (31)</option>
            </select>
        </div>
        <div class="filter-group" id="typeFilterGroup" style="display:none;">
            <label>Sub-set:</label>
            <select id="filterType" onchange="filterCards()"></select>
        </div>
        <div class="filter-group">
            <label>Search:</label>
            <input type="text" id="searchInput" placeholder="Search cards..." oninput="filterCards()">
        </div>
        <div class="card-count" id="cardCount">8 cards</div>
    </div>
    
    <!-- Cards Grid -->
    <div class="cards-container" id="cardsContainer"></div>
    
    <!-- Add Card Modal -->
    <div class="modal" id="cardModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Card</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <div class="form-grid">
                <div class="form-group">
                    <label>Card ID</label>
                    <input type="text" id="cardId" placeholder="2.0 3.4.8">
                </div>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="cardTitle" placeholder="GLAMOUR">
                </div>
                <div class="form-group full">
                    <label>Description</label>
                    <textarea id="cardDescription" placeholder="An attractive or exciting quality..."></textarea>
                </div>
                <div class="form-group">
                    <label>Set</label>
                    <select id="cardSet">
                        <option value="Conversation">Conversation</option>
                        <option value="Values">Value Lens</option>
                        <option value="Choice">Choice Lens</option>
                        <option value="Flow">Flow Lens</option>
                        <option value="Harmony">Harmony Lens</option>
                        <option value="Synergy">Synergy Lens</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Sub-set</label>
                    <input type="text" id="cardType" placeholder="Operations Conversation">
                </div>
                <div class="form-group full">
                    <label>Color Gradient</label>
                    <select id="cardColor">
                        <option value="green">Green (Operations)</option>
                        <option value="pink">Pink (Synergy)</option>
                        <option value="purple">Purple (Research)</option>
                        <option value="lightblue">Light Blue (Learning)</option>
                        <option value="neonblue">Neon Blue (Infrastructure)</option>
                        <option value="orange">Orange (Services)</option>
                        <option value="yellow">Yellow (Creativity)</option>
                        <option value="red">Red (Marketing)</option>
                        <option value="darkpink">Dark Pink (Stewardship)</option>
                        <option value="gray">Gray (Conversational Killer)</option>
                        <option value="palegreen">Pale Green (Value Lens)</option>
                        <option value="metallicblue">Metallic Blue (Choice Lens)</option>
                        <option value="beige">Beige (Harmony/Other)</option>
                    </select>
                </div>
            </div>
            
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn" onclick="addCard()">Add Card</button>
            </div>
        </div>
    </div>

    <!-- View Card Modal -->
    <div class="modal" id="viewCardModal">
        <div class="modal-content view-card-content">
            <div class="modal-header">
                <h2>Card Details</h2>
                <button class="close-btn" onclick="closeViewModal()">&times;</button>
            </div>
            <div class="view-card-body">
                <div class="view-card-preview" id="viewCardPreview"></div>
                <dl class="view-card-meta" id="viewCardMeta"></dl>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeViewModal()">Close</button>
                <button class="btn" disabled title="Editing cards from the UI is coming in a future update">&#9998; Edit (coming soon)</button>
            </div>
        </div>
    </div>

    <script src="../shared/cards-data.js"></script>
    <script>
        let allCards = [...window.INFLOW_CARDS];
        let filteredCards = [...allCards];

        const SET_LABELS = {
            Conversation: 'Conversation',
            Values: 'Value Lens',
            Choice: 'Choice Lens',
            Flow: 'Flow Lens',
            Harmony: 'Harmony Lens',
            Synergy: 'Synergy Lens'
        };

        function createCard(cardData, opts) {
            opts = opts || {};
            const card = document.createElement('div');
            card.className = 'card';

            const isConversationCard = cardData.set === 'Conversation';
            const showId = cardData.id && cardData.id.trim() !== '';

            card.innerHTML = `
                <div class="card-background gradient-${cardData.color}">
                    ${isConversationCard ? '<div class="light-beam beam-top"></div>' : ''}
                    ${isConversationCard ? '<div class="light-beam beam-bottom"></div>' : ''}
                </div>
                ${isConversationCard ? '<div class="pole pole-top">Intention</div>' : ''}
                <div class="card-content">
                    <div class="card-type">${cardData.type}</div>
                    <div class="card-title">${cardData.title}</div>
                    <div class="card-description-box">
                        <div class="card-description">${cardData.description}</div>
                    </div>
                    ${showId ? `<div class="card-id">${cardData.id}</div>` : ''}
                </div>
                ${isConversationCard ? '<div class="pole pole-bottom">Attention</div>' : ''}
            `;

            if (!opts.static) {
                card.addEventListener('click', () => openViewModal(cardData));
            }

            return card;
        }
        
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            if (filteredCards.length === 0) {
                container.innerHTML = '<div class="empty-state"><h2>No cards found</h2><p>Try adjusting your filters or add a new card.</p></div>';
                return;
            }
            
            filteredCards.forEach(cardData => {
                container.appendChild(createCard(cardData));
            });
            
            document.getElementById('cardCount').textContent = `${filteredCards.length} card${filteredCards.length !== 1 ? 's' : ''}`;
        }
        
        function filterCards() {
            const setFilter = document.getElementById('filterSet').value;
            const typeFilter = document.getElementById('filterType').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            filteredCards = allCards.filter(card => {
                const matchesSet = !setFilter || card.set === setFilter;
                const matchesType = !typeFilter || card.type === typeFilter;
                const matchesSearch = !searchTerm ||
                    card.title.toLowerCase().includes(searchTerm) ||
                    card.description.toLowerCase().includes(searchTerm) ||
                    card.type.toLowerCase().includes(searchTerm);
                return matchesSet && matchesType && matchesSearch;
            });

            renderCards();
        }

        // Sub-set (card.type) options depend on the selected Set, since only
        // some sets currently have more than one distinct sub-set value.
        function populateTypeFilter() {
            const setFilter = document.getElementById('filterSet').value;
            const relevant = setFilter ? allCards.filter(c => c.set === setFilter) : allCards;
            const types = [...new Set(relevant.map(c => c.type).filter(t => t && t.trim()))].sort();

            const typeSelect = document.getElementById('filterType');
            const typeGroup = document.getElementById('typeFilterGroup');
            const previousValue = typeSelect.value;

            typeSelect.innerHTML = '';
            const allOption = document.createElement('option');
            allOption.value = '';
            allOption.textContent = 'All Sub-sets';
            typeSelect.appendChild(allOption);
            types.forEach(type => {
                const opt = document.createElement('option');
                opt.value = type;
                opt.textContent = type;
                typeSelect.appendChild(opt);
            });

            // Only show when a specific Set is selected and that set actually
            // has more than one distinct sub-set value -- with "All Sets"
            // selected, or a set that just repeats its own name as the
            // sub-set for every card (currently everything but Conversation),
            // there's no useful choice to make.
            if (setFilter && types.length > 1) {
                typeSelect.value = types.includes(previousValue) ? previousValue : '';
                typeGroup.style.display = 'flex';
            } else {
                typeSelect.value = '';
                typeGroup.style.display = 'none';
            }
        }

        function onSetFilterChange() {
            populateTypeFilter();
            filterCards();
        }

        function openViewModal(cardData) {
            const preview = document.getElementById('viewCardPreview');
            preview.innerHTML = '';
            preview.appendChild(createCard(cardData, { static: true }));

            const setLabel = SET_LABELS[cardData.set] || cardData.set;
            const showId = cardData.id && cardData.id.trim() !== '';
            document.getElementById('viewCardMeta').innerHTML = `
                <dt>Title</dt><dd>${cardData.title}</dd>
                <dt>Set</dt><dd>${setLabel}</dd>
                <dt>Sub-set</dt><dd>${cardData.type || '—'}</dd>
                <dt>Color</dt><dd>${cardData.color}</dd>
                ${showId ? `<dt>ID</dt><dd>${cardData.id}</dd>` : ''}
                <dt>Description</dt><dd>${cardData.description || '—'}</dd>
            `;

            document.getElementById('viewCardModal').classList.add('active');
        }

        function closeViewModal() {
            document.getElementById('viewCardModal').classList.remove('active');
        }

        function openModal() {
            document.getElementById('cardModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('cardModal').classList.remove('active');
            // Clear form
            document.getElementById('cardId').value = '';
            document.getElementById('cardTitle').value = '';
            document.getElementById('cardDescription').value = '';
            document.getElementById('cardType').value = '';
        }
        
        function addCard() {
            const newCard = {
                id: document.getElementById('cardId').value || '',
                title: document.getElementById('cardTitle').value || 'UNTITLED',
                description: document.getElementById('cardDescription').value || 'No description provided.',
                set: document.getElementById('cardSet').value,
                type: document.getElementById('cardType').value || 'Uncategorized',
                color: document.getElementById('cardColor').value
            };
            
            allCards.push(newCard);
            populateTypeFilter();
            filterCards();
            closeModal();
        }
        
        function exportJSON() {
            const dataStr = JSON.stringify({ 
                cards: allCards,
                metadata: {
                    totalCards: allCards.length,
                    exportDate: new Date().toISOString(),
                    version: "1.0"
                }
            }, null, 2);
            
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = 'inflow-matrix-cards.json';
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }
        
        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeViewModal();
            }
        });

        // Close modal on background click
        document.getElementById('cardModal').addEventListener('click', (e) => {
            if (e.target.id === 'cardModal') closeModal();
        });
        document.getElementById('viewCardModal').addEventListener('click', (e) => {
            if (e.target.id === 'viewCardModal') closeViewModal();
        });

        // Initial render
        populateTypeFilter();
        renderCards();
    </script>
</body>
</html>
