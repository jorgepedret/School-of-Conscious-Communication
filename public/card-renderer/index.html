<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inflow Matrix Card Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a2e;
            color: white;
        }
        
        /* Header */
        .header {
            background: rgba(0,0,0,0.5);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .header-actions {
            display: flex;
            gap: 1rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }
        
        /* Filters */
        .filters {
            padding: 1.5rem 2rem;
            background: rgba(0,0,0,0.3);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .filter-group label {
            font-size: 14px;
            font-weight: 600;
        }
        
        .filter-group select,
        .filter-group input {
            padding: 0.5rem;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 5px;
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 14px;
        }
        
        .card-count {
            margin-left: auto;
            font-size: 14px;
            opacity: 0.7;
        }
        
        /* Cards Grid */
        .cards-container {
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .card {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            justify-self: center;
        }
        
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 60px rgba(102,126,234,0.5);
        }
        
        .card-background {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* Gradients */
        .gradient-green { background: radial-gradient(ellipse at center, #90EE90 0%, #32CD32 50%, #228B22 100%); }
        .gradient-pink { background: radial-gradient(ellipse at center, #FFB6C1 0%, #FF69B4 50%, #C71585 100%); }
        .gradient-gray { background: radial-gradient(ellipse at center, #D3D3D3 0%, #A9A9A9 50%, #696969 100%); }
        .gradient-blue { background: radial-gradient(ellipse at center, #87CEEB 0%, #4682B4 50%, #4169E1 100%); }
        .gradient-beige { background: radial-gradient(ellipse at center, #F5F5DC 0%, #D2B48C 50%, #BC987E 100%); }
        .gradient-purple { background: radial-gradient(ellipse at center, #DDA0DD 0%, #9370DB 50%, #8A2BE2 100%); }
        .gradient-lightblue { background: radial-gradient(ellipse at center, #B0E0E6 0%, #87CEEB 50%, #5F9EA0 100%); }
        .gradient-neonblue { background: radial-gradient(ellipse at center, #00CED1 0%, #1E90FF 50%, #0000CD 100%); }
        .gradient-orange { background: radial-gradient(ellipse at center, #FFD580 0%, #FFA500 50%, #FF8C00 100%); }
        .gradient-yellow { background: radial-gradient(ellipse at center, #FFFFE0 0%, #FFD700 50%, #FFA500 100%); }
        .gradient-red { background: radial-gradient(ellipse at center, #FFA07A 0%, #FF6347 50%, #DC143C 100%); }
        .gradient-darkpink { background: radial-gradient(ellipse at center, #FF69B4 0%, #C71585 50%, #8B008B 100%); }
        .gradient-palegreen { background: radial-gradient(ellipse at center, #E8F5E8 0%, #C8E6C8 50%, #A8D8A8 100%); }
        .gradient-metallicblue { background: radial-gradient(ellipse at center, #D0E8F0 0%, #A0C8D8 50%, #7090A8 100%); }
        
        .light-beam {
            position: absolute;
            width: 120px;
            height: 250px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.4;
        }
        
        .beam-top {
            top: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            clip-path: polygon(40% 0%, 60% 0%, 80% 100%, 20% 100%);
        }
        
        .beam-bottom {
            bottom: 0;
            background: linear-gradient(0deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            clip-path: polygon(20% 0%, 80% 0%, 60% 100%, 40% 100%);
        }
        
        .pole {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            border: 3px solid;
            border-radius: 20px;
            padding: 8px 30px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            z-index: 10;
        }
        
        .pole-top {
            top: 15px;
            border-color: #90EE90;
            color: #555;
        }
        
        .pole-bottom {
            bottom: 15px;
            border-color: #87CEEB;
            color: #555;
        }
        
        .card-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 85%;
            z-index: 5;
        }
        
        .card-type {
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: capitalize;
            background: rgba(255,255,255,0.7);
            padding: 3px 12px;
            border-radius: 12px;
            display: inline-block;
        }
        
        .card-title {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: clamp(28px, 8vw, 38px);
            font-weight: 900;
            color: #000;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
            line-height: 0.95;
        }
        
        .card-description-box {
            background: rgba(255,255,255,0.6);
            border-radius: 20px;
            padding: 15px 20px;
            margin: 10px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }
        
        .card-description {
            font-size: 13px;
            line-height: 1.4;
            color: #333;
            font-weight: 500;
        }
        
        .card-id {
            font-size: 14px;
            color: rgba(0,0,0,0.8);
            font-weight: 700;
            font-family: 'Arial', sans-serif;
            background: rgba(255,255,255,0.8);
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 8px;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eee;
        }
        
        .modal-header h2 {
            color: #333;
            font-size: 1.5rem;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 2rem;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .close-btn:hover {
            color: #333;
        }
        
        .form-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: 1fr 1fr;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group.full {
            grid-column: 1 / -1;
        }
        
        .form-group label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            color: #333;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .modal-actions .btn {
            flex: 1;
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(255,255,255,0.5);
        }
        
        .empty-state h2 {
            margin-bottom: 1rem;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>Inflow Matrix Card Browser</h1>
        <div class="header-actions">
            <button class="btn" onclick="openModal()">+ Add New Card</button>
            <button class="btn btn-secondary" onclick="exportJSON()">Export JSON</button>
        </div>
    </div>
    
    <!-- Filters -->
    <div class="filters">
        <div class="filter-group">
            <label>Set:</label>
            <select id="filterSet" onchange="filterCards()">
                <option value="">All Sets</option>
                <option value="Conversation">Conversation (80)</option>
                <option value="Values">Value Lens (115)</option>
                <option value="Choice">Choice Lens (39)</option>
                <option value="Flow">Flow Lens</option>
                <option value="Harmony">Harmony Lens (30)</option>
                <option value="Synergy">Synergy Lens (31)</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Search:</label>
            <input type="text" id="searchInput" placeholder="Search cards..." oninput="filterCards()">
        </div>
        <div class="card-count" id="cardCount">8 cards</div>
    </div>
    
    <!-- Cards Grid -->
    <div class="cards-container" id="cardsContainer"></div>
    
    <!-- Add Card Modal -->
    <div class="modal" id="cardModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Card</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <div class="form-grid">
                <div class="form-group">
                    <label>Card ID</label>
                    <input type="text" id="cardId" placeholder="2.0 3.4.8">
                </div>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="cardTitle" placeholder="GLAMOUR">
                </div>
                <div class="form-group full">
                    <label>Description</label>
                    <textarea id="cardDescription" placeholder="An attractive or exciting quality..."></textarea>
                </div>
                <div class="form-group">
                    <label>Set</label>
                    <select id="cardSet">
                        <option value="Conversation">Conversation</option>
                        <option value="Values">Value Lens</option>
                        <option value="Choice">Choice Lens</option>
                        <option value="Flow">Flow Lens</option>
                        <option value="Harmony">Harmony Lens</option>
                        <option value="Synergy">Synergy Lens</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Sub-set</label>
                    <input type="text" id="cardType" placeholder="Operations Conversation">
                </div>
                <div class="form-group full">
                    <label>Color Gradient</label>
                    <select id="cardColor">
                        <option value="green">Green (Operations)</option>
                        <option value="pink">Pink (Synergy)</option>
                        <option value="purple">Purple (Research)</option>
                        <option value="lightblue">Light Blue (Learning)</option>
                        <option value="neonblue">Neon Blue (Infrastructure)</option>
                        <option value="orange">Orange (Services)</option>
                        <option value="yellow">Yellow (Creativity)</option>
                        <option value="red">Red (Marketing)</option>
                        <option value="darkpink">Dark Pink (Stewardship)</option>
                        <option value="gray">Gray (Conversational Killer)</option>
                        <option value="palegreen">Pale Green (Value Lens)</option>
                        <option value="metallicblue">Metallic Blue (Choice Lens)</option>
                        <option value="beige">Beige (Harmony/Other)</option>
                    </select>
                </div>
            </div>
            
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn" onclick="addCard()">Add Card</button>
            </div>
        </div>
    </div>

        let allCards = [...sampleCards];
        let filteredCards = [...allCards];
        
        function createCard(cardData) {
            const card = document.createElement('div');
            card.className = 'card';
            
            const isConversationCard = cardData.set === 'Conversation';
            const showId = cardData.id && cardData.id.trim() !== '';
            
            card.innerHTML = `
                <div class="card-background gradient-${cardData.color}">
                    ${isConversationCard ? '<div class="light-beam beam-top"></div>' : ''}
                    ${isConversationCard ? '<div class="light-beam beam-bottom"></div>' : ''}
                </div>
                ${isConversationCard ? '<div class="pole pole-top">Intention</div>' : ''}
                <div class="card-content">
                    <div class="card-type">${cardData.type}</div>
                    <div class="card-title">${cardData.title}</div>
                    <div class="card-description-box">
                        <div class="card-description">${cardData.description}</div>
                    </div>
                    ${showId ? `<div class="card-id">${cardData.id}</div>` : ''}
                </div>
                ${isConversationCard ? '<div class="pole pole-bottom">Attention</div>' : ''}
            `;
            
            return card;
        }
        
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            if (filteredCards.length === 0) {
                container.innerHTML = '<div class="empty-state"><h2>No cards found</h2><p>Try adjusting your filters or add a new card.</p></div>';
                return;
            }
            
            filteredCards.forEach(cardData => {
                container.appendChild(createCard(cardData));
            });
            
            document.getElementById('cardCount').textContent = `${filteredCards.length} card${filteredCards.length !== 1 ? 's' : ''}`;
        }
        
        function filterCards() {
            const setFilter = document.getElementById('filterSet').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            filteredCards = allCards.filter(card => {
                const matchesSet = !setFilter || card.set === setFilter;
                const matchesSearch = !searchTerm || 
                    card.title.toLowerCase().includes(searchTerm) ||
                    card.description.toLowerCase().includes(searchTerm) ||
                    card.type.toLowerCase().includes(searchTerm);
                return matchesSet && matchesSearch;
            });
            
            renderCards();
        }
        
        function openModal() {
            document.getElementById('cardModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('cardModal').classList.remove('active');
            // Clear form
            document.getElementById('cardId').value = '';
            document.getElementById('cardTitle').value = '';
            document.getElementById('cardDescription').value = '';
            document.getElementById('cardType').value = '';
        }
        
        function addCard() {
            const newCard = {
                id: document.getElementById('cardId').value || '',
                title: document.getElementById('cardTitle').value || 'UNTITLED',
                description: document.getElementById('cardDescription').value || 'No description provided.',
                set: document.getElementById('cardSet').value,
                type: document.getElementById('cardType').value || 'Uncategorized',
                color: document.getElementById('cardColor').value
            };
            
            allCards.push(newCard);
            filterCards();
            closeModal();
        }
        
        function exportJSON() {
            const dataStr = JSON.stringify({ 
                cards: allCards,
                metadata: {
                    totalCards: allCards.length,
                    exportDate: new Date().toISOString(),
                    version: "1.0"
                }
            }, null, 2);
            
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = 'inflow-matrix-cards.json';
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }
        
        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        
        // Close modal on background click
        document.getElementById('cardModal').addEventListener('click', (e) => {
            if (e.target.id === 'cardModal') closeModal();
        });
        
        // Initial render
        renderCards();
    </script>
